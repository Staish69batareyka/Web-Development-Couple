<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% if object %}Редактирование устройства{% else %}Добавление устройства{% endif %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .form-container { background: white; padding: 20px; border-radius: 8px; max-width: 500px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { color: #333; }
        .form-group { margin-bottom: 15px; }
        .btn { background-color: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
        .btn:hover { background-color: #0056b3; }
    </style>
</head>
<body>
<header style="background: #333; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <div><strong>Мой Проект</strong></div>
    <nav>
        {% if user.is_authenticated %}
            <span>Привет, {{ user.username }}!</span>
            <a href="{% url 'logout' %}" style="color: #ff4d4d; margin-left: 15px; text-decoration: none;">Выйти</a>
        {% else %}
            <a href="{% url 'login' %}" style="color: #cbd5e1; text-decoration: none; margin-right: 15px;">Войти</a> [cite: 342]
            <a href="#" style="color: #cbd5e1; text-decoration: none;">Зарегистрироваться</a> [cite: 342]
        {% endif %}
    </nav>
</header>
<div class="form-container">
    <h2>{% if object %}Редактировать устройство{% else %}Добавить новое устройство{% endif %}</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Сохранить</button>
    </form>
</div>

</body>
</html>
